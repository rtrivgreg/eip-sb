name: Terraform POC

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      vpc_profile:
        description: "Curated VPC profile"
        required: true
        type: choice
        options:
          - minimal
          - development
          - production
        default: development
      source:
        description: "Who triggered this"
        required: false
        type: string
        default: "browser-button"

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: us-east-1
  TF_WORKING_DIR: poc
  TF_STATE_BUCKET: rg-tf-state-dev
  TF_LOCK_TABLE: rg-tf-locks-dev
  TF_ROLE_ARN: arn:aws:iam::418295699841:role/GitHubActionsTerraformDev

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    outputs:
      backend_key: ${{ steps.backend_key.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Echo trigger inputs
        run: |
          echo "action=${{ inputs.action }}"
          echo "vpc_profile=${{ inputs.vpc_profile }}"
          echo "source=${{ inputs.source }}"

      - name: Set backend key
        id: backend_key
        run: echo "value=vpc-endpoints/poc/${{ inputs.vpc_profile }}/terraform.tfstate" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -no-color -reconfigure \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ steps.backend_key.outputs.value }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_vpc_profile: ${{ inputs.vpc_profile }}
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_vpc_profile: ${{ inputs.vpc_profile }}
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -no-color -input=false -var-file=terraform.tfvars
          else
            terraform plan -no-color -input=false -var-file=terraform.tfvars
          fi

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -no-color -reconfigure \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.plan.outputs.backend_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_vpc_profile: ${{ inputs.vpc_profile }}
        run: terraform apply -no-color -auto-approve -input=false -var-file=terraform.tfvars

  destroy:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -no-color -reconfigure \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.plan.outputs.backend_key }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_vpc_profile: ${{ inputs.vpc_profile }}
        run: terraform destroy -no-color -auto-approve -input=false -var-file=terraform.tfvars
